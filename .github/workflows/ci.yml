name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  musl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CFLAGS_x86_64_unknown_linux_musl: -march=x86-64 -mtune=generic
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools libclang-dev libssl-dev pkg-config perl qemu-user
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy --target x86_64-unknown-linux-musl
          rustup default 1.100.0
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-unknown-linux-musl
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --all-targets --target x86_64-unknown-linux-musl -- -D warnings
      - name: Build release
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Test release
        run: cargo test --locked --release --target x86_64-unknown-linux-musl
      - name: Check baseline CPU compatibility
        run: bash scripts/test-cpu-compatibility.sh target/x86_64-unknown-linux-musl/release/sendmail2http
      - name: Check static executable
        run: |
          file target/x86_64-unknown-linux-musl/release/sendmail2http
          file target/x86_64-unknown-linux-musl/release/sendmail2http | grep -E 'statically linked|static-pie linked'
          target/x86_64-unknown-linux-musl/release/sendmail2http --version
      - name: Package executable
        run: tar -C target/x86_64-unknown-linux-musl/release -czf sendmail2http-x86_64-linux-musl.tar.gz sendmail2http
      - uses: actions/upload-artifact@v7
        with:
          name: sendmail2http-x86_64-linux-musl
          path: sendmail2http-x86_64-linux-musl.tar.gz
          if-no-files-found: error
